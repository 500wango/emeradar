x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://emeradar_app:${EMERADAR_DB_PASSWORD:?Set a hex EMERADAR_DB_PASSWORD in .env}@postgres:5432/emeradar
  APP_ORIGIN: ${APP_ORIGIN:-https://emeradar.com}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://emeradar.com}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set STRIPE_SECRET_KEY in .env}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET in .env}
  SERP_API_KEY: ${SERP_API_KEY:-}
  BRAVE_API_KEY: ${BRAVE_API_KEY:-}
  AISA_API_KEY: ${AISA_API_KEY:-}
  AISA_SEARCH_URL: ${AISA_SEARCH_URL:-https://api.aisa.one/apis/v1/tavily/search}
  BROWSERLESS_API_KEY: ${BROWSERLESS_API_KEY:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  ALERT_FROM_EMAIL: ${ALERT_FROM_EMAIL:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GSC_REDIRECT_URI: ${GSC_REDIRECT_URI:-}
  GSC_TOKEN_ENCRYPTION_KEY: ${GSC_TOKEN_ENCRYPTION_KEY:-}
  DISCOVERY_RSS_FEEDS: ${DISCOVERY_RSS_FEEDS:-}
  DISCOVERY_VALIDATION_BUDGET_USD: ${DISCOVERY_VALIDATION_BUDGET_USD:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      EMERADAR_DB_PASSWORD: ${EMERADAR_DB_PASSWORD:?Set a hex EMERADAR_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-emeradar.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    shm_size: 128mb
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  caddy:
    image: caddy:2-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  worker:
    profiles: [jobs]
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    cpus: 0.75
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  migrate:
    profiles: [migrate]
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["pnpm", "db:migrate"]
    mem_limit: 768m
    cpus: 0.75
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
