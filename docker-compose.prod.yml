x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://emeradar_app:${EMERADAR_DB_PASSWORD:?Set a hex EMERADAR_DB_PASSWORD in .env}@postgres:5432/emeradar
  # pg-boss 的 LISTEN/NOTIFY 与会话级锁不能被 transaction 模式的连接池切断（ADR-003 /
  # ADR-012）。当前拓扑里没有 PgBouncer，因此留空即可：空值会回落到 DATABASE_URL
  # （见 packages/db/src/client.ts）。变量本身仍然要在这里声明——PgBouncer 上线那天
  # "队列走哪条连接"必须已经是一个显式的配置项，而不是当天临时想起来的一个改动。
  DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL:-}
  APP_ORIGIN: ${APP_ORIGIN:-https://emeradar.com}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://emeradar.com}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set STRIPE_SECRET_KEY in .env}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET in .env}
  SERP_API_KEY: ${SERP_API_KEY:-}
  AISA_API_KEY: ${AISA_API_KEY:-}
  # AIsa 多源搜索的 discovery 种子查询；留空则关闭该源
  AISA_SEARCH_QUERIES: ${AISA_SEARCH_QUERIES:-}
  SEED_MARKETS: ${SEED_MARKETS:-}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET: ${R2_BUCKET:-}
  R2_ENDPOINT: ${R2_ENDPOINT:-}
  BROWSERLESS_API_KEY: ${BROWSERLESS_API_KEY:-}
  # 邮件通道：SMTP 优先（自建 Stalwart / 任何 SMTP 服务商），其次 Resend。
  # 两个都没配时发送只返回 false 并写日志，不会伪造"已发送"。
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_SECURE: ${SMTP_SECURE:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  ALERT_FROM_EMAIL: ${ALERT_FROM_EMAIL:-}
  # 后台任务连续失败时的告警收件人（逗号分隔）。留空则回落到库里在职的 ADMIN 账号，
  # 见 apps/worker/src/job-failure.ts —— 告警通道的配置本身也会被忘掉，而"系统管理员"
  # 这个身份已经在库里了。
  OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GSC_REDIRECT_URI: ${GSC_REDIRECT_URI:-}
  GSC_TOKEN_ENCRYPTION_KEY: ${GSC_TOKEN_ENCRYPTION_KEY:-}
  DISCOVERY_RSS_FEEDS: ${DISCOVERY_RSS_FEEDS:-}
  DISCOVERY_VALIDATION_BUDGET_USD: ${DISCOVERY_VALIDATION_BUDGET_USD:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      EMERADAR_DB_PASSWORD: ${EMERADAR_DB_PASSWORD:?Set a hex EMERADAR_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-emeradar.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    shm_size: 128mb
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  caddy:
    image: caddy:2-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  worker:
    # 常驻消费者（ADR-003）：排期、重试与死信策略都在 apps/worker/src/tasks.ts 里，
    # 所以它必须一直在，而不是由宿主机 cron 每次叫醒一次。**没有** `profiles` ——
    # `up -d worker` 就该把它拉起来，与 web 同级。
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Compose sends SIGKILL after this deadline; pg-boss gets 120s to drain active work.
    stop_grace_period: 150s
    # 只验证"队列实例在心跳"，不验证端口 —— 这个容器不对外提供服务。
    healthcheck:
      test: ["CMD", "pnpm", "--filter", "@emeradar/worker", "health"]
      interval: 30s
      timeout: 15s
      retries: 3
      # 心跳口径是"三次未跳动即视为安静"（默认 30 秒一跳），起动阶段给它一次宽限，
      # 免得刚拉起就被判成不健康。
      start_period: 120s
    mem_limit: 768m
    cpus: 0.75
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  migrate:
    profiles: [migrate]
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["pnpm", "db:migrate"]
    mem_limit: 768m
    cpus: 0.75
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
