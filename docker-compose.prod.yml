services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - default
      - database
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1.0

  worker:
    profiles: [jobs]
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - default
      - database
    mem_limit: 2048m
    cpus: 1.5

  migrate:
    profiles: [migrate]
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - default
      - database
    entrypoint: ["pnpm", "db:migrate"]

networks:
  default: {}
  database:
    external: true
    name: ${POSTGRES_NETWORK:?Set POSTGRES_NETWORK to the existing PostgreSQL Docker network}
