name: Deploy to VPS

on:
  push:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Reuses the CI workflow (lint/typecheck + unit tests) as a mandatory gate.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            git fetch origin master
            git checkout master
            git reset --hard origin/master
            docker compose -f docker-compose.prod.yml --profile migrate config --quiet
            COMPOSE_PARALLEL_LIMIT=1 docker compose -f docker-compose.prod.yml --profile migrate build
            docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 120 postgres
            docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
            # worker 是常驻消费者（ADR-003）：与 web 一起 `up -d`。`--no-build` 用的
            # 就是上面那次 build 的镜像，所以它和 web 是同一份代码。
            docker compose -f docker-compose.prod.yml up -d --no-build worker
            docker compose -f docker-compose.prod.yml up -d --no-build web caddy
            # 候选池为空时补种一次；只空库触发，不覆盖日常 seed-keywords。
            CANDIDATES=$(docker compose -f docker-compose.prod.yml exec -T postgres \
              psql -U postgres -d emeradar -tAc \
              "SELECT COUNT(*) FROM opportunities WHERE status='CANDIDATE' AND COALESCE(is_demo,false)=false" | tr -d '[:space:]')
            if [ "$CANDIDATES" = "0" ]; then
              echo "Candidate pool empty; running seed-keywords once..."
              docker compose -f docker-compose.prod.yml run --rm worker seed-keywords || \
                echo "seed-keywords failed; worker will retry on its schedule."
            fi
            curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused --max-time 10 http://127.0.0.1:3000/login >/dev/null
