name: Deploy to VPS

on:
  push:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            git fetch origin master
            git checkout master
            git reset --hard origin/master
            docker compose -f docker-compose.prod.yml --profile jobs --profile migrate config --quiet
            COMPOSE_PARALLEL_LIMIT=1 docker compose -f docker-compose.prod.yml --profile jobs --profile migrate build
            docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 120 postgres
            docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
            docker compose -f docker-compose.prod.yml up -d --no-build web caddy
            curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused --max-time 10 http://127.0.0.1:3000/login >/dev/null
