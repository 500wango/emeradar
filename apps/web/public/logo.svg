<svg
  width="1200"
  height="320"
  viewBox="0 0 1200 320"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="emeradar-logo-title emeradar-logo-desc"
>
  <title id="emeradar-logo-title">EmeRadar</title>
  <desc id="emeradar-logo-desc">
    EmeRadar — Find markets before they get crowded.
  </desc>

  <defs>
    <!-- Icon gradient -->
    <linearGradient
      id="iconGradient"
      x1="60"
      y1="230"
      x2="300"
      y2="70"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="35%" stop-color="#2563EB"/>
      <stop offset="68%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Eme word gradient -->
    <linearGradient
      id="emeGradient"
      x1="350"
      y1="100"
      x2="680"
      y2="220"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- ========================= -->
  <!-- ICON -->
  <!-- ========================= -->

  <!-- Small rising block -->
  <path
    d="M58 205
       Q58 193 69 188
       L115 166
       Q128 160 128 174
       L128 230
       Q128 239 119 243
       L73 260
       Q58 265 58 249
       Z"
    fill="url(#iconGradient)"
  />

  <!-- Middle rising block -->
  <path
    d="M138 159
       Q138 148 149 142
       L213 109
       Q227 102 227 118
       L227 211
       Q227 221 218 226
       L155 258
       Q138 266 138 248
       Z"
    fill="url(#iconGradient)"
  />

  <!-- Top arrow / block -->
  <path
    d="M230 101
       L286 72
       Q299 65 299 80
       L299 151
       Q299 159 292 164
       L254 190
       Q242 198 242 183
       L242 125
       L218 125
       Q204 125 214 114
       Z"
    fill="url(#iconGradient)"
  />

  <!-- ========================= -->
  <!-- WORDMARK -->
  <!-- ========================= -->

  <text
    x="350"
    y="194"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="124"
    font-weight="800"
    letter-spacing="-6"
    fill="url(#emeGradient)"
  >
    Eme
  </text>

  <text
    x="625"
    y="194"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="124"
    font-weight="800"
    letter-spacing="-6"
    fill="#0F172A"
  >
    Radar
  </text>

  <!-- ========================= -->
  <!-- TAGLINE -->
  <!-- ========================= -->

  <text
    x="350"
    y="251"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="32"
    font-weight="500"
    letter-spacing="0"
    fill="#64748B"
  >
    Find markets before they get crowded.
  </text>
</svg>
